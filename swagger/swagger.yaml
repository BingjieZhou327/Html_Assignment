openapi: 3.0.0
info:
  title: User Management API
  description: RESTful APIs for user management with secure password handling and image uploads
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: User
    description: User management operations

paths:
  /user/create:
    post:
      tags:
        - User
      summary: Create a new user
      description: Creates a new user with full name, email, and password. Password is securely hashed using bcrypt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  description: User's full name (only alphabetic characters)
                  example: John Doe
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  description: Password (min 8 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special char)
                  example: Password123!
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully.
        '400':
          description: Validation failed or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/edit:
    put:
      tags:
        - User
      summary: Update user details
      description: Updates user's full name and/or password. Email cannot be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (used to identify user, cannot be changed)
                  example: john.doe@example.com
                fullName:
                  type: string
                  description: Updated full name (optional)
                  example: Jane Doe
                password:
                  type: string
                  format: password
                  description: Updated password (optional)
                  example: NewPassword123!
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully.
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/delete:
    delete:
      tags:
        - User
      summary: Delete a user
      description: Deletes a user from the database by their email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email of the user to delete
                  example: john.doe@example.com
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully.
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/getAll:
    get:
      tags:
        - User
      summary: Retrieve all users
      description: Returns a list of all users with their full name, email, and hashed password
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        fullName:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: john.doe@example.com
                        password:
                          type: string
                          description: Hashed password
                          example: $2b$10$abcdefghijklmnopqrstuv
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/uploadImage:
    post:
      tags:
        - User
      summary: Upload user image
      description: Allows a user to upload one image file. Accepts JPEG, PNG, and GIF formats only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - image
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user
                  example: john.doe@example.com
                image:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, or GIF, max 5MB)
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Image uploaded successfully.
                  filePath:
                    type: string
                    example: /images/image-1234567890.jpg
        '400':
          description: Invalid file format, image already exists, or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFormat:
                  value:
                    error: Invalid file format. Only JPEG, PNG, and GIF are allowed.
                imageExists:
                  value:
                    error: Image already exists for this user.
                noFile:
                  value:
                    error: No image file provided.
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Validation failed.
        details:
          type: array
          description: Detailed validation errors (optional)
          items:
            type: object
            properties:
              msg:
                type: string
              param:
                type: string
              location:
                type: string

    User:
      type: object
      properties:
        fullName:
          type: string
          description: User's full name
          example: John Doe
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        password:
          type: string
          description: Hashed password
          example: $2b$10$abcdefghijklmnopqrstuv
        imagePath:
          type: string
          description: Path to user's uploaded image
          example: /images/image-1234567890.jpg

